name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # create the GitHub release

jobs:
  release:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hookpost
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/hookpost?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Tag matches the Version constant
        run: |
          want="v$(sed -n 's/^const Version = "\(.*\)"$/\1/p' hookpost.go)"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match hookpost.Version ($want)"
            exit 1
          fi

      - run: go test -race -count=1 ./...

      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            /^## \[/                     { on = 0 }
            /^\[[^]]+\]: /               { next }
            on' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no entry for $v"
            exit 1
          fi
          cat notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag $flags \
            --title "$GITHUB_REF_NAME" --notes-file notes.md

      - name: Warm the Go module proxy
        # go list -m prints the lowercase module path from go.mod; the GitHub
        # owner name has capitals, which the proxy would escape differently.
        run: GOPROXY=proxy.golang.org go list -m "$(go list -m)@${GITHUB_REF_NAME}"

version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    # Only direct deps: indirect x/* bumps often raise the go directive past
    # our minimum. govulncheck in CI flags any that matter for security.
    allow:
      - dependency-type: direct
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /examples/receiver-node
    schedule:
      interval: monthly
